<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cleaning Business Manager</title>
<style>
/* Design tokens — single source of truth for colors/spacing/radius/shadow/fonts.
   tools/app_template.html (the "simple" architecture) hand-syncs its own inline
   :root block to these same names/values (see tests/test_app.py's token-drift
   test) since it must stay single-file and can't @import this file. Change a
   value here AND there, never one without the other. */
/* Breakpoints (documented here, not as custom properties — media queries need
   literal px): 480 = small phone, 680 = nav collapses to a top bar (see
   01_components.css), 960 = wide desktop (two-column dashboard/workspace layouts
   via .grid-2, see 01_components.css). */
:root {
  --color-bg: #F4F8FB;
  --color-ink: #14202E;
  --color-accent: #2B6CA3;
  --color-card: #fff;
  --color-muted: #566678;
  --color-border: #d5e0ea;
  --color-danger: #B3434B;

  /* Semantic feedback colors (banners, inline validation) — tinted background +
     an ink-like text color, same pairing convention as --color-danger above. */
  --color-success: #2F6B4F;
  --color-success-bg: #E3F0E7;
  --color-warning: #8A5A00;
  --color-warning-bg: #FBF0D9;
  --color-info: #2C5F8A;
  --color-info-bg: #E4EEF5;
  --color-error-bg: #F7E3E4;

  /* Solid button-background colors. Deliberately FIXED — the same value in both
     light and dark mode, unlike --color-accent/--color-danger above (which stay
     theme-adaptive for foreground/decorative use: chart fills, icons, borders,
     where lightening in dark mode is correct). A theme-adaptive color that gets
     LIGHTER in dark mode is wrong for a solid button background carrying white
     text — tests/test_app.py's contrast tests + validators/app_check.py's
     check_color_contrast verify these two pairs hold >= 4.5:1 in both themes. */
  --color-primary: #1E3A5F;
  --color-on-primary: #fff;
  --color-danger-strong: #B3434B;
  --color-on-danger: #fff;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 16px;
  --radius-full: 999px;

  --shadow-sm: 0 1px 6px rgba(0, 0, 0, .06);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, .14);

  /* Type scale. h1/h2/h3 below use these; .text-sm/.text-xs/.caption are utility
     classes for secondary copy — see 01_components.css. */
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.375rem;
  --text-2xl: 1.75rem;
  --leading-tight: 1.25;
  --leading-normal: 1.5;

  /* Named after the same brand families tools/fonts/ ships (used in the guide
     PDFs via tools/pdf_kit.py) — a browser with them installed renders on-brand;
     everyone else falls back to a clean system stack. The TTFs themselves are
     not embedded here (keeps the self-contained HTML small — see CLAUDE.md). */
  --font-body: "Nunito Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-heading: "Quicksand", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
:root[data-theme="dark"] {
  --color-bg: #0F1A26;
  --color-ink: #E6EEF5;
  --color-accent: #8FC1E8;
  --color-card: #172433;
  --color-muted: #9fb1c2;
  --color-border: #2a3b4d;
  --color-danger: #e58a92;

  --color-success: #8FCBA8;
  --color-success-bg: #1E3A2B;
  --color-warning: #E8C067;
  --color-warning-bg: #3A2F12;
  --color-info: #8FC1E8;
  --color-info-bg: #1C3246;
  --color-error-bg: #3A1F21;

  /* --color-primary/--color-on-primary/--color-danger-strong/--color-on-danger
     intentionally NOT overridden here — see the base :root comment above. */
}

* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-body); font-size: var(--text-base); line-height: var(--leading-normal); background: var(--color-bg); color: var(--color-ink); }
h1, h2, h3 { font-family: var(--font-heading); line-height: var(--leading-tight); margin: var(--space-2) 0 var(--space-1); }
h1 { font-size: var(--text-2xl); }
h2 { font-size: var(--text-xl); }
h3 { font-size: var(--text-lg); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}


/* Structural layout + reusable component classes. Shares every color/spacing/radius
   token with tools/app_template.html's inline <style> (see 00_tokens.css's header) —
   keep both in sync, verified by tests/test_app.py's token-drift/component tests. */
#app-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); }
#app-controls { display: flex; gap: var(--space-2); }
#app-body { display: flex; min-height: calc(100vh - 56px); }
#view-nav { display: flex; flex-direction: column; gap: var(--space-1); width: 180px; padding: var(--space-4) var(--space-2); border-right: 1px solid var(--color-border); flex-shrink: 0; }
#view-nav button { text-align: left; background: transparent; border: 0; padding: var(--space-3) var(--space-3); border-radius: var(--radius-sm); font: inherit; color: var(--color-ink); cursor: pointer; }
#view-nav button[aria-current="page"] { background: var(--color-card); font-weight: 600; }
#view-root { flex: 1; padding: var(--space-5) var(--space-5) 60px; max-width: 760px; }
/* h1/h2/h3 sizing comes from 00_tokens.css's type scale. */
p.sub { margin: 0 0 var(--space-5); color: var(--color-muted); font-size: var(--text-sm); }

.card { background: var(--color-card); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-4); box-shadow: var(--shadow-sm); }
.row { display: flex; gap: var(--space-2); }

input[type=text], input[type=number], textarea {
  flex: 1; min-width: 0; font: inherit; padding: 10px 12px;
  border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  background: var(--color-card); color: var(--color-ink);
}

/* background/color use the FIXED --color-primary/--color-danger-strong pair (see
   00_tokens.css) — not --color-accent/--color-danger, whose dark-mode-lightened
   values drop white-text contrast well below WCAG AA when used as a solid fill. */
button { font: inherit; padding: 10px 14px; border: 0; border-radius: var(--radius-sm); background: var(--color-primary); color: var(--color-on-primary); cursor: pointer; }
button.ghost { background: transparent; color: var(--color-ink); border: 1px solid var(--color-border); }
button.danger { background: var(--color-danger-strong); color: var(--color-on-danger); }

:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

ul { list-style: none; padding: 0; margin: var(--space-3) 0 0; }
li { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: 10px 0; border-top: 1px solid var(--color-border); }

/* Uses the fixed --color-primary pair, same contrast reasoning as buttons above —
   a persistent banner has the same white-text-on-solid-fill requirement. */
#demo-banner { text-align: center; padding: var(--space-2); margin: 0; background: var(--color-primary); color: var(--color-on-primary); font-size: var(--text-sm); }
#demo-banner[hidden] { display: none; }

/* Empty-state: a single reusable pattern for "nothing here yet" sections. */
.empty-state { text-align: center; padding: 40px var(--space-4); color: var(--color-muted); }
.empty-state strong { display: block; color: var(--color-ink); margin-bottom: var(--space-1); }

/* Toast/snackbar: transient feedback, dismissed by the caller via [hidden]. */
.toast {
  position: fixed; left: 50%; bottom: var(--space-4); transform: translateX(-50%);
  background: var(--color-ink); color: var(--color-bg); padding: 10px var(--space-4);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); font-size: .9rem;
}
.toast[hidden] { display: none; }

/* Banner/alert: persistent inline feedback (validation summaries, zone warnings),
   distinct from the transient floating .toast above. One semantic variant class
   required: success|warning|error|info. */
.banner { display: flex; align-items: flex-start; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); font-size: var(--text-sm); margin-bottom: var(--space-4); }
.banner.success { background: var(--color-success-bg); color: var(--color-success); }
.banner.warning { background: var(--color-warning-bg); color: var(--color-warning); }
.banner.error { background: var(--color-error-bg); color: var(--color-danger); }
.banner.info { background: var(--color-info-bg); color: var(--color-info); }

/* Form field group: label + control + optional help text + error state. Wrap any
   existing input/textarea/select in a .field; add .has-error plus a .field-error
   element (role="alert" so screen readers announce it) when validation fails. */
.field { margin-bottom: var(--space-4); }
.field label { display: block; margin-bottom: 6px; font-weight: 600; font-size: var(--text-sm); }
.field .help { display: block; margin-top: 4px; color: var(--color-muted); font-size: var(--text-xs); }
.field.has-error input, .field.has-error textarea, .field.has-error select { border-color: var(--color-danger); }
.field-error { display: block; margin-top: 4px; color: var(--color-danger); font-size: var(--text-xs); }
select {
  flex: 1; min-width: 0; font: inherit; padding: 10px 12px;
  border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  background: var(--color-card); color: var(--color-ink);
}

/* Table: header row, row separators, a horizontal-scroll wrapper for narrow
   screens so a wide table never breaks layout instead of silently clipping. */
.table-scroll { overflow-x: auto; margin-bottom: var(--space-4); }
table.table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
table.table th { text-align: left; padding: var(--space-2) var(--space-3); color: var(--color-muted); font-weight: 600; border-bottom: 1px solid var(--color-border); }
table.table td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); }
table.table tbody tr:hover { background: var(--color-bg); }

/* Tabs: role="tablist"/"tab"/"tabpanel" convention. Toggling is handled by
   App.ui.initTabs(root) in main.js — this is presentation only. */
.tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-4); }
.tabs [role="tab"] { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: var(--space-2) var(--space-3); color: var(--color-muted); cursor: pointer; }
.tabs [role="tab"][aria-selected="true"] { color: var(--color-ink); border-bottom-color: var(--color-primary); font-weight: 600; }
[role="tabpanel"][hidden] { display: none; }

/* Loading: a CSS-only spinner and a skeleton shimmer block. Both go static under
   prefers-reduced-motion (see 00_tokens.css's global rule). */
.spinner { width: 20px; height: 20px; border-radius: var(--radius-full); border: 2.5px solid var(--color-border); border-top-color: var(--color-primary); animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.skeleton { background: var(--color-border); border-radius: var(--radius-sm); animation: skeleton-pulse 1.4s ease-in-out infinite; }
@keyframes skeleton-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

/* Modal: native <dialog> — no extra JS library needed for open/close/backdrop.
   .modal-header/.modal-body/.modal-footer are an optional structural convention
   for anything beyond a one-line confirm. */
dialog.modal { border: 0; border-radius: var(--radius-lg); padding: var(--space-5); max-width: 420px; width: 90%; box-shadow: var(--shadow-md); background: var(--color-card); color: var(--color-ink); }
dialog.modal::backdrop { background: rgba(0, 0, 0, .4); }
.modal-header { font-family: var(--font-heading); font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-3); }
.modal-body { margin-bottom: var(--space-4); }
.modal-footer { display: flex; justify-content: flex-end; gap: var(--space-2); }

/* Accordion: native <details>/<summary> — Help/FAQ sections, no JS required. */
details.accordion { border-bottom: 1px solid var(--color-border); padding: var(--space-3) 0; }
details.accordion summary { cursor: pointer; font-weight: 600; }
details.accordion[open] summary { color: var(--color-primary); }
details.accordion .answer { margin-top: var(--space-2); color: var(--color-ink); }

/* Layout utilities for dashboard/workspace views: .stack is the default vertical
   flow (explicit for readability); .grid-2 goes two columns at >=680px. */
.stack { display: flex; flex-direction: column; gap: var(--space-4); }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: var(--space-4); }
@media (min-width: 680px) {
  .grid-2 { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 680px) {
  #app-body { flex-direction: column; }
  #view-nav { flex-direction: row; width: auto; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--color-border); }
  #view-root { max-width: none; padding: var(--space-4); }
  .tabs { overflow-x: auto; }
}


/* Cleaning-business-app additions on top of the shared design system. Colors come from the
   tokens in 00_tokens.css — no hard-coded hex here. */

input[type=date], input[type=time], input[type=text], input[type=number], select {
  width: 100%; font: inherit; font-size: var(--text-base); line-height: 1.3; min-height: 50px; padding: 12px 16px;
  border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-card); color: var(--color-ink);
}
/* Dropdowns: our own chevron with room on the right, so the text never touches the edge. */
select {
  -webkit-appearance: none; appearance: none; cursor: pointer; padding-right: 48px; text-overflow: ellipsis;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%23566678' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat: no-repeat; background-position: right 16px center; background-size: 20px;
}
:root[data-theme="dark"] select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%239fb1c2' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
}
.field input, .field select { width: 100%; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--color-primary); flex-shrink: 0; margin: 0; }
button.small { padding: 6px 10px; font-size: var(--text-sm); }
.row.wrap { flex-wrap: wrap; }
.caption { color: var(--color-muted); font-size: var(--text-xs); }
.nowrap { white-space: nowrap; }
.neg { color: var(--color-danger); font-weight: 600; }
table.table input.cell-input { width: 7.5em; min-height: 40px; padding: 8px 10px; }
table.table input.cell-input.invalid { border-color: var(--color-danger); }
tr.row-over td { background: var(--color-error-bg); }
tr.total-row td { font-weight: 700; border-top: 2px solid var(--color-border); }
table.table td select { width: auto; min-height: 40px; padding: 8px 40px 8px 12px; background-position: right 12px center; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-4); }
.stat { background: var(--color-card); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat-label { font-size: var(--text-xs); color: var(--color-muted); text-transform: uppercase; letter-spacing: .04em; }
.stat-value { font-family: var(--font-heading); font-size: 1.9rem; line-height: 1.1; color: var(--color-primary); overflow-wrap: anywhere; }
:root[data-theme="dark"] .stat-value { color: var(--color-accent); }
.stat.bad .stat-value { color: var(--color-danger); }
.stat-sub { font-size: var(--text-xs); color: var(--color-muted); overflow-wrap: anywhere; }

.badge { font-size: var(--text-xs); color: var(--color-muted); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 2px 10px; white-space: nowrap; }
label.check { display: flex; align-items: center; gap: var(--space-3); cursor: pointer; flex: 1; min-width: 0; }
label.check.done span { text-decoration: line-through; color: var(--color-muted); }
.progress { height: 10px; background: var(--color-border); border-radius: var(--radius-full); margin-top: var(--space-2); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--color-primary); }
li { flex-wrap: wrap; }

#print-area { display: none; }
@media print {
  body.printing #app, body.printing dialog { display: none !important; }
  body.printing #print-area { display: block; padding: 0; color: #000; background: #fff; }
  body.printing .table { font-size: 12pt; }
  body.printing table.table th, body.printing table.table td { border-bottom: 1px solid #999; color: #000; }
}


/* ---------- Header: logo, menu toggle, icon actions ---------- */
#app-header { position: sticky; top: 0; z-index: 20; background: var(--color-bg); gap: var(--space-3); min-height: 60px; }
#brand { display: flex; align-items: center; gap: var(--space-2); min-width: 0; margin-right: auto; }
#brand-logo { flex-shrink: 0; }
#app-title { font-family: var(--font-heading); font-size: var(--text-lg); color: var(--color-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-theme="dark"] #app-title { color: var(--color-accent); }
#app-controls { display: flex; align-items: center; gap: var(--space-2); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; height: 40px; padding: 0 10px; background: transparent; color: var(--color-ink); border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
.icon-btn:hover { background: var(--color-card); }
.icon-btn .label { font-size: var(--text-sm); }
#menuToggle { display: none; }

/* ---------- Desktop: use the whole width ---------- */
#view-nav { position: sticky; top: 61px; align-self: flex-start; white-space: nowrap; }
#view-nav button { white-space: nowrap; }
#view-root { max-width: 1480px; width: 100%; min-width: 0; }
.split { display: grid; grid-template-columns: 1fr; gap: var(--space-4); align-items: start; }
.split > .main, .split > .side { min-width: 0; }
.cols-2 { display: block; }
.grid-2.top { align-items: start; }
.bars { margin: 0; }
.bars li { display: block; padding: var(--space-2) 0; }
.bar-head { display: flex; justify-content: space-between; gap: var(--space-2); font-size: var(--text-sm); margin-bottom: 4px; }
.bar { position: relative; height: 8px; background: var(--color-border); border-radius: var(--radius-full); overflow: hidden; }
.bar .est { position: absolute; left: 0; top: 0; bottom: 0; background: var(--color-border); border-right: 2px solid var(--color-muted); }
.bar .act { position: absolute; left: 0; top: 0; bottom: 0; background: var(--color-primary); border-radius: var(--radius-full); }
.bar.over .act { background: var(--color-danger-strong); }
@media (min-width: 981px) {
  .split { grid-template-columns: minmax(300px, 380px) 1fr; }
  .split > .side { position: sticky; top: 76px; }
  .cols-2 { column-count: 2; column-gap: var(--space-4); }
  .cols-2 > .card { break-inside: avoid; }
  #view-root { padding: var(--space-5) var(--space-6) 60px; }
}
@media (min-width: 681px) and (max-width: 980px) {
  .split { grid-template-columns: 1fr; }
}

/* ---------- Phone: drop-down menu, compact header ---------- */
@media (max-width: 680px) {
  #menuToggle { display: inline-flex; }
  #app-header { padding: var(--space-2) var(--space-3); min-height: 56px; gap: var(--space-2); }
  #app-controls { gap: var(--space-1); }
  #app-controls .label { display: none; }
  .icon-btn { min-width: 38px; height: 38px; padding: 0 8px; }
  #app-title { font-size: var(--text-base); }
  #view-nav { display: none; position: fixed; left: 0; right: 0; top: 57px; z-index: 19; flex-direction: column; width: auto; max-height: calc(100vh - 57px); overflow-y: auto;
    background: var(--color-card); border: 0; border-bottom: 1px solid var(--color-border); box-shadow: var(--shadow-md); padding: var(--space-2); }
  body.menu-open #view-nav { display: flex; }
  #view-nav button { padding: 14px var(--space-3); font-size: var(--text-base); }
}
@media (max-width: 360px) { #app-title { display: none; } }

@media (min-width: 681px) { #view-nav { min-height: calc(100vh - 61px); } }

/* ---------- Tables: nowrap action columns; stacked cards on phones ---------- */
table.table td:last-child { white-space: nowrap; }
table.table.cardrows td.neg, table.table.cardrows td[data-label="Amount due"] { white-space: nowrap; }
/* The invoices table is wide; keep it full width until there is room for a side column. */
@media (min-width: 981px) and (max-width: 1599px) { .split.late { grid-template-columns: 1fr; } .split.late > .side { position: static; order: 2; } }
@media (max-width: 680px) {
  table.table.cardrows thead { display: none; }
  table.table.cardrows, table.table.cardrows tbody { display: block; }
  table.table.cardrows tr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border); }
  table.table.cardrows td { display: block; border: 0; padding: 0; min-width: 0; }
  table.table.cardrows td::before { content: attr(data-label); display: block; font-size: var(--text-xs); color: var(--color-muted); text-transform: uppercase; letter-spacing: .04em; }
  table.table.cardrows td:first-child { grid-column: 1 / -1; font-weight: 700; font-size: var(--text-base); }
  table.table.cardrows td:first-child::before, table.table.cardrows td:empty { display: none; }
  table.table.cardrows td:last-child { grid-column: 1 / -1; }
  table.table.cardrows td:last-child::before { display: none; }
  table.table.cardrows td select { width: 100%; }
  table.table.cardrows input.cell-input { width: 100%; }
  table.table.cardrows tr.total-row td:first-child { font-size: var(--text-lg); }
  table.table.cardrows tbody tr:hover { background: transparent; }
}

/* ---------- Cleaning business additions ---------- */
.badge.ok { color: var(--color-success); border-color: var(--color-success); }
.badge.bad { color: var(--color-danger); border-color: var(--color-danger); }
tr.row-muted td { color: var(--color-muted); text-decoration: line-through; }
ul.plain { list-style: disc; padding-left: var(--space-5); margin: var(--space-2) 0; font-size: var(--text-sm); }
ul.plain li { display: list-item; padding: 2px 0; }
.job-line { display: flex; flex-direction: column; min-width: 0; }
.legend { display: flex; gap: var(--space-4); font-size: var(--text-sm); margin-bottom: var(--space-2); }
.legend .key::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend .key.inc::before { background: var(--color-accent); }
.legend .key.exp::before { background: var(--color-muted); }
svg.chart { width: 100%; height: auto; max-height: 260px; display: block; }
.quote-price { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: var(--space-3); }
.quote-price strong { font-family: var(--font-heading); font-size: 2.25rem; line-height: 1.1; color: var(--color-primary); }
:root[data-theme="dark"] .quote-price strong { color: var(--color-accent); }
.quote-out table.table th { text-align: left; font-weight: 600; color: var(--color-muted); width: 45%; }
.main > .card + .card { margin-top: var(--space-4); }
/* On phones and narrow windows the list comes first and the add form below it. */
@media (max-width: 980px) { .split.listfirst > .main { order: -1; } }

/* ---------- Big numbers and charts ---------- */
.stat-grid.hero { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.stat.big { padding: var(--space-4) var(--space-5); }
.stat.big .stat-value { font-size: 2.9rem; }
.stat.big .stat-label { font-size: var(--text-sm); }
.donut-wrap { display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
svg.donut { width: 190px; height: 190px; flex-shrink: 0; }
svg.donut .center-num { font-family: var(--font-heading); font-size: 9px; font-weight: 700; fill: var(--color-ink); }
svg.donut .center-lab { font-size: 3.6px; fill: var(--color-muted); }
.donut-legend { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 160px; }
.donut-legend li { display: flex; justify-content: space-between; gap: var(--space-3); padding: 6px 0; border-bottom: 1px solid var(--color-border); font-size: var(--text-sm); }
.donut-legend li:last-child { border-bottom: 0; }
.donut-legend .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
.hbars { list-style: none; margin: 0; padding: 0; }
.hbars li { display: block; padding: var(--space-2) 0; }
.hbars .hb-head { display: flex; justify-content: space-between; gap: var(--space-2); font-size: var(--text-sm); margin-bottom: 4px; }
.hbars .hb-track { height: 12px; background: var(--color-border); border-radius: var(--radius-full); overflow: hidden; }
.hbars .hb-fill { display: block; height: 100%; background: var(--color-accent); border-radius: var(--radius-full); }
.chart-note { color: var(--color-muted); font-size: var(--text-xs); margin: var(--space-2) 0 0; }

</style>

<script>
window.APP_DEMO_MODE = true;

/* Minimal hash router. Each module (app_src/modules/*.js) registers a view on
 * App.views[id] = {navLabel, render(root)} and pushes id onto App.nav, in the order
 * it should appear in the nav. render(root) MUST set root.dataset.activeView = id and
 * replace root's content with that view's real markup (never just scroll to an anchor —
 * validators/app_check.py's multi-view check clicks every nav item and asserts both
 * data-active-view and the visible text actually change). */
(function () {
  window.App = window.App || { views: {}, nav: [] };

  function show(id) {
    var view = App.views[id];
    if (!view) {
      id = App.nav[0];
      view = App.views[id];
    }
    if (!view) return;
    view.render(document.getElementById('view-root'));
    document.querySelectorAll('#view-nav [data-nav]').forEach(function (b) {
      b.setAttribute('aria-current', b.dataset.nav === id ? 'page' : 'false');
    });
    if (location.hash !== '#' + id) location.hash = '#' + id;
    if (App.ui && App.ui.closeMenu) App.ui.closeMenu();
  }

  function buildNav() {
    var nav = document.getElementById('view-nav');
    nav.innerHTML = '';
    App.nav.forEach(function (id) {
      var b = document.createElement('button');
      b.type = 'button';
      b.dataset.nav = id;
      b.textContent = App.views[id].navLabel;
      b.addEventListener('click', function () { show(id); });
      nav.appendChild(b);
    });
  }

  // show() itself sets location.hash, which fires hashchange a moment later. Only re-render
  // when the hash points at a DIFFERENT view (back/forward, typed URL) — otherwise that echo
  // re-renders the current view and wipes anything the user has just started typing.
  window.addEventListener('hashchange', function () {
    var id = location.hash.slice(1);
    if (document.getElementById('view-root').dataset.activeView !== id) show(id);
  });
  window.AppRouter = {
    init: function () {
      buildNav();
      show(location.hash.slice(1) || App.nav[0]);
    },
  };
})();


/* Shared helpers: safe DOM building (user-entered names are never parsed as HTML),
 * money in whole cents, dates, ids, CSV import/export and a print helper. Every view
 * module below composes these. */
(function (g) {
  var App = g.App = g.App || { views: {}, nav: [] };

  /** h('div', {class, text, attrs:{}, on:{click}, dataset:{}}, ...children) */
  function h(tag, props) {
    var el = document.createElement(tag);
    var p = props || {};
    Object.keys(p).forEach(function (k) {
      var v = p[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'on') Object.keys(v).forEach(function (ev) { el.addEventListener(ev, v[ev]); });
      else if (k === 'dataset') Object.keys(v).forEach(function (d) { el.dataset[d] = v[d]; });
      else if (k === 'attrs') Object.keys(v).forEach(function (a) { if (v[a] != null && v[a] !== false) el.setAttribute(a, v[a] === true ? '' : v[a]); });
      else el[k] = v;
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, child) {
    if (child == null || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (c) { append(el, c); }); return; }
    el.appendChild(typeof child === 'string' || typeof child === 'number' ? document.createTextNode(String(child)) : child);
  }

  /* ---------- Money (whole cents) ---------- */
  function currency() { return App.store.get('currency', 'USD'); }
  function fmt(cents) {
    var c = Math.round(cents || 0);
    var whole = c % 100 === 0;
    try {
      return new Intl.NumberFormat(undefined, {
        style: 'currency', currency: currency(),
        minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: 2,
      }).format(c / 100);
    } catch (e) {
      return (c / 100).toFixed(whole ? 0 : 2);
    }
  }
  /** "1,234.50" / "1.234,50" / "12" -> cents, or null when it is not a number. */
  function parseMoney(str) {
    var s = String(str == null ? '' : str).replace(/[^\d.,-]/g, '');
    if (!s || s === '-' || s === '.' || s === ',') return null;
    var hasDot = s.indexOf('.') >= 0, hasComma = s.indexOf(',') >= 0;
    if (hasDot && hasComma) {
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (hasComma) {
      s = /,\d{1,2}$/.test(s) ? s.replace(',', '.') : s.replace(/,/g, '');
    }
    var n = parseFloat(s);
    return isFinite(n) ? Math.round(n * 100) : null;
  }
  function inputMoney(cents) {
    if (!cents) return '';
    var v = cents / 100;
    return v % 1 === 0 ? String(v) : v.toFixed(2);
  }

  /* ---------- Dates ---------- */
  function parseISO(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function today() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function daysUntil(iso) {
    var d = parseISO(iso);
    return d ? Math.round((d - today()) / 86400000) : null;
  }
  function fmtDate(d) {
    try { return new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric' }).format(d); }
    catch (e) { return d.toDateString(); }
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function iso(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  /** Same day-of-month, clamped to the last day when the target month is shorter. */
  function addMonths(d, n) {
    var first = new Date(d.getFullYear(), d.getMonth() + n, 1);
    var last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    return new Date(first.getFullYear(), first.getMonth(), Math.min(d.getDate(), last));
  }
  function monthKey(isoDate) { return String(isoDate || '').slice(0, 7); }
  function monthLabel(key) {
    var m = /^(\d{4})-(\d{2})$/.exec(key || '');
    if (!m) return key || '';
    try { return new Intl.DateTimeFormat(undefined, { month: 'short', year: '2-digit' }).format(new Date(+m[1], +m[2] - 1, 1)); }
    catch (e) { return key; }
  }

  /* ---------- CSV (import and export) ---------- */
  /** Parses CSV text (quoted fields, "" escapes, CRLF/LF, a trailing blank line) into rows of strings. */
  function parseCSV(text) {
    var rows = [], row = [], cur = '', q = false, i = 0, s = String(text || '').replace(/^\uFEFF/, '');
    for (; i < s.length; i++) {
      var ch = s[i];
      if (q) {
        if (ch === '"') { if (s[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && s[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else cur += ch;
    }
    row.push(cur);
    if (row.length > 1 || row[0] !== '') rows.push(row);
    return rows;
  }
  function csvCell(v) {
    var s = v == null ? '' : String(v);
    // Spreadsheet formula injection: a leading = + - @ would be run as a formula when opened.
    if (/^[=+\-@]/.test(s) && isNaN(Number(s))) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(rows) { return rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n') + '\r\n'; }
  function download(filename, text, type) {
    var blob = new Blob([text], { type: type || 'text/csv' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  /* ---------- Small shared UI pieces ---------- */
  function field(id, label, control, help) {
    return h('div', { class: 'field' },
      h('label', { attrs: { for: id }, text: label }), control,
      help ? h('span', { class: 'help', text: help }) : null,
      h('span', { class: 'field-error', attrs: { role: 'alert' } }));
  }
  function setError(fieldEl, message) {
    fieldEl.classList.add('has-error');
    fieldEl.querySelector('.field-error').textContent = message;
    var c = fieldEl.querySelector('input,select');
    if (c) { c.setAttribute('aria-invalid', 'true'); c.focus(); }
  }
  function clearErrors(root) {
    root.querySelectorAll('.field.has-error').forEach(function (f) {
      f.classList.remove('has-error');
      f.querySelector('.field-error').textContent = '';
      var c = f.querySelector('input,select');
      if (c) c.removeAttribute('aria-invalid');
    });
  }
  function banner(kind, text) { return h('div', { class: 'banner ' + kind, attrs: { role: kind === 'error' || kind === 'warning' ? 'alert' : 'status' }, text: text }); }
  function stat(label, value, sub, tone) {
    return h('div', { class: 'stat' + (tone ? ' ' + tone : '') },
      h('span', { class: 'stat-label', text: label }), h('strong', { class: 'stat-value', text: value }),
      sub ? h('span', { class: 'stat-sub', text: sub }) : null);
  }
  function emptyState(title, text) {
    return h('div', { class: 'empty-state' }, h('strong', { text: title }), text ? h('span', { text: text }) : null);
  }
  /** Wraps a table for horizontal scroll and copies each header into its cells' data-label,
   *  which the phone layout uses to show every row as a labelled card (see 02_wedding.css). */
  function tableWrap(table) {
    var heads = Array.prototype.map.call(table.querySelectorAll('thead th'), function (th) { return th.textContent; });
    table.querySelectorAll('tbody tr').forEach(function (tr) {
      Array.prototype.forEach.call(tr.children, function (td, i) { if (heads[i]) td.setAttribute('data-label', heads[i]); });
    });
    return h('div', { class: 'table-scroll' }, table);
  }

  /** Native <dialog> confirm. Resolves true on confirm. */
  function confirmDialog(title, message, confirmLabel) {
    return new Promise(function (resolve) {
      var done = false;
      var dlg = h('dialog', { class: 'modal' });
      function finish(v) { done = true; resolve(v); if (dlg.open) dlg.close(); }
      dlg.appendChild(h('div', { class: 'modal-header', text: title }));
      dlg.appendChild(h('div', { class: 'modal-body', text: message }));
      dlg.appendChild(h('div', { class: 'modal-footer' },
        h('button', { type: 'button', class: 'ghost', text: 'Cancel', on: { click: function () { finish(false); } } }),
        h('button', { type: 'button', class: 'danger', text: confirmLabel || 'Confirm', on: { click: function () { finish(true); } } })));
      dlg.addEventListener('close', function () { dlg.remove(); if (!done) resolve(false); });
      document.body.appendChild(dlg);
      dlg.showModal();
    });
  }

  /** Prints just `title` + a copy of `node` (nothing else on the page). */
  function printSheet(title, node) {
    var old = document.getElementById('print-area');
    if (old) old.remove();
    var area = h('div', { id: 'print-area' }, h('h1', { text: title }), node.cloneNode(true));
    document.body.appendChild(area);
    document.body.classList.add('printing');
    var cleaned = false;
    function cleanup() {
      if (cleaned) return;
      cleaned = true;
      document.body.classList.remove('printing');
      area.remove();
    }
    window.addEventListener('afterprint', cleanup, { once: true });
    setTimeout(cleanup, 60000);
    window.print();
  }

  App.core = {
    h: h, fmt: fmt, parseMoney: parseMoney, inputMoney: inputMoney,
    parseISO: parseISO, today: today, daysUntil: daysUntil, fmtDate: fmtDate,
    uid: uid, iso: iso, addDays: addDays, addMonths: addMonths, monthKey: monthKey, monthLabel: monthLabel,
    parseCSV: parseCSV, toCSV: toCSV, download: download,
    field: field, setError: setError, clearErrors: clearErrors, banner: banner, stat: stat,
    emptyState: emptyState, tableWrap: tableWrap, confirmDialog: confirmDialog, printSheet: printSheet,
  };
})(window);


/* Data access + every computed number the app shows. Keeping the arithmetic in one
 * place (all money in whole cents) is what the audit's totals checks rely on. There are
 * no spreadsheet formulas here to overwrite: totals are always recomputed from the
 * records. */
(function (g) {
  var App = g.App = g.App || { views: {}, nav: [] };
  var C = App.core;

  var SIZES = [
    ['Small (up to 1,000 sq ft)', 1.0], ['Medium (1,000 to 1,800 sq ft)', 1.75],
    ['Large (1,800 to 2,800 sq ft)', 2.5], ['Extra large (2,800 sq ft and up)', 3.5],
  ];
  var TYPES = [['Standard clean', 1, 'standard'], ['Deep clean', 1.6, 'deep'], ['Move-in / move-out clean', 1.9, 'move']];
  var FREQS = [['One-off', 0, 'none'], ['Monthly', 0.05, 'monthly'], ['Every two weeks', 0.10, 'biweekly'], ['Weekly', 0.15, 'weekly']];
  /** How many visits a new repeating job creates (the first one included). */
  var SERIES_COUNT = { weekly: 12, biweekly: 8, monthly: 6 };
  var EXPENSE_CATEGORIES = ['Supplies', 'Fuel and mileage', 'Equipment', 'Insurance', 'Marketing', 'Software', 'Wages', 'Other'];

  function find(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }

  var D = App.data = {
    SIZES: SIZES, TYPES: TYPES, FREQS: FREQS, EXPENSE_CATEGORIES: EXPENSE_CATEGORIES,
    CURRENCIES: ['USD', 'EUR', 'GBP', 'CAD', 'AUD', 'NZD', 'CHF', 'SEK', 'NOK', 'DKK', 'MAD', 'AED', 'ZAR', 'INR', 'MXN', 'BRL', 'JPY'],

    business: function () { return App.store.get('business', { setupDone: false, name: '', rate: 0 }); },
    saveBusiness: function (b) { App.store.set('business', b); },
    list: function (key) { return App.store.get(key, []); },
    save: function (key, arr) { App.store.set(key, arr); },
    client: function (id) { return find(D.list('clients'), id); },
    clientName: function (id) { var c = D.client(id); return c ? c.name : '(removed client)'; },

    /* ---------- Quotes ---------- */
    /** hours = (base size + 0.25 per bedroom + 0.5 per bathroom) x clean type, rounded to a quarter hour;
     *  price = hours x hourly rate, less the repeat discount. Every step is returned so it can be shown. */
    quote: function (inp, rate) {
      var size = SIZES[inp.size] || SIZES[0], type = TYPES[inp.type] || TYPES[0], freq = FREQS[inp.freq] || FREQS[0];
      var beds = Math.max(0, inp.beds || 0), baths = Math.max(0, inp.baths || 0);
      var raw = (size[1] + 0.25 * beds + 0.5 * baths) * type[1];
      var hours = Math.max(1, Math.round(raw * 4) / 4);
      var gross = Math.round(hours * (rate || 0));
      var discount = Math.round(gross * freq[1]);
      return {
        hours: hours, rate: rate || 0, gross: gross, discount: discount, discountPct: Math.round(freq[1] * 100),
        price: gross - discount, repeat: freq[2], typeLabel: type[0], sizeLabel: size[0], beds: beds, baths: baths,
      };
    },

    /* ---------- Jobs ---------- */
    /** ISO dates for a new job: just the first date, or the whole series when it repeats. */
    seriesDates: function (startIso, repeat) {
      var start = C.parseISO(startIso), n = SERIES_COUNT[repeat] || 1, out = [];
      if (!start) return out;
      for (var i = 0; i < n; i++) {
        out.push(C.iso(repeat === 'weekly' ? C.addDays(start, 7 * i) : repeat === 'biweekly' ? C.addDays(start, 14 * i) : repeat === 'monthly' ? C.addMonths(start, i) : start));
      }
      return out;
    },
    sortedJobs: function () {
      return D.list('jobs').slice().sort(function (a, b) {
        var ka = a.date + ' ' + (a.time || ''), kb = b.date + ' ' + (b.time || '');
        return ka < kb ? -1 : ka > kb ? 1 : 0;
      });
    },
    jobsOn: function (isoDate) {
      return D.sortedJobs().filter(function (j) { return j.date === isoDate && j.status !== 'cancelled'; });
    },

    /* ---------- Invoices ---------- */
    invoicePaid: function (inv) {
      var t = 0;
      (inv.payments || []).forEach(function (p) { t += p.amount || 0; });
      return t;
    },
    invoiceDue: function (inv) { return Math.max(0, (inv.amount || 0) - D.invoicePaid(inv)); },
    isOverdue: function (inv) { return D.invoiceDue(inv) > 0 && !!inv.due && inv.due < C.iso(C.today()); },
    invoiceStatus: function (inv) {
      var due = D.invoiceDue(inv);
      if (due === 0) return 'paid';
      if (D.isOverdue(inv)) return 'overdue';

    },

   * others. Pure DOM wiring — presentation lives entirely in CSS. */
  App.ui = {
    initTabs: function (root) {
      var tabs = root.querySelectorAll('[role="tab"]');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          var panelId = tab.getAttribute('aria-controls');
          tabs.forEach(function (t) { t.setAttribute('aria-selected', 'false'); });
          root.querySelectorAll('[role="tabpanel"]').forEach(function (p) { p.hidden = true; });
          tab.setAttribute('aria-selected', 'true');
          var panel = document.getElementById(panelId);
          if (panel) panel.hidden = false;
        });
      });
    },
  };

  /* Mobile menu: the nav collapses into a drop-down under the header below 680px. */
  var menuBtn = document.getElementById('menuToggle');
  App.ui.closeMenu = function () {
    document.body.classList.remove('menu-open');
    menuBtn.setAttribute('aria-expanded', 'false');
    menuBtn.setAttribute('aria-label', 'Open menu');
  };
  menuBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = document.body.classList.toggle('menu-open');
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  });
  document.addEventListener('click', function (e) {
    if (document.body.classList.contains('menu-open') && !e.target.closest('#view-nav')) App.ui.closeMenu();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') App.ui.closeMenu(); });

  function applyTheme() {
    var theme = App.store.get('theme', 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }
  applyTheme();
  document.getElementById('themeToggle').addEventListener('click', function () {
    App.store.set('theme', App.store.get('theme', 'light') === 'dark' ? 'light' : 'dark');
    applyTheme();
  });

  document.getElementById('exportBtn').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'backup.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  document.getElementById('importBtn').addEventListener('click', function () {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var s = JSON.parse(r.result);
        if (s && typeof s === 'object') {
          state = s;
          save(state);
          applyTheme();
          AppRouter.init();
        } else {
          alert('This file is not a valid backup.');
        }
      } catch (err) {
        alert('This file is not a valid backup.');
      }
    };
    r.readAsText(f);
  });

  if (window.APP_DEMO_MODE) {
    document.getElementById('demo-banner').hidden = false;
  }

  AppRouter.init();
})();

</script>
</body>
</html>
